# Builds every Minecraft version, runs the game tests on a headless server for each,
# and attaches the jars to the run (Actions tab -> the run -> Artifacts).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gradle needs Java 25 for the 26.x versions; the 1.21.x jars are still compiled for Java 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # chmod: commits made on Windows usually lose gradlew's executable bit.
      - run: chmod +x gradlew && ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: hardgrind-noop
          path: build/libs/*.jar
          if-no-files-found: error
